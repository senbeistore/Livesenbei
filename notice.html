<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>折扣碼使用說明｜Senbei.Store</title>
<style>
  :root {
    --brown: #854626;
    --brown-dark: #6b3a20;
    --cream: #faf5ee;
    --ink: #2b2118;
    --muted: #7a6a5c;
    --line: #e6d9c9;
    --warn: #b3261e;
    --warn-bg: #fdecea;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #efe5d6;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
    color: var(--ink);
  }

  /* 固定 1080 x 1440（3:4）的畫布，依視窗大小等比例縮放，整頁一次截圖 */
  #stage {
    position: absolute;
    left: 50%; top: 50%;
    width: 1080px; height: 1440px;
    transform-origin: 0 0;
    background: var(--cream);
    padding: 48px 54px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 16px;
    line-height: 1.5;
  }

  .hero {
    background: var(--brown);
    color: #fff;
    border-radius: 28px;
    padding: 24px 28px 26px;
    text-align: center;
  }
  .hero .brand { font-size: 26px; letter-spacing: .34em; opacity: .8; }
  .hero h1 { margin: 4px 0 10px; font-size: 72px; line-height: 1.2; letter-spacing: .04em; }
  .hero p { margin: 0; font-size: 38px; font-weight: 700; }
  .hero p b { background: #fff; color: var(--brown-dark); padding: 0 12px; border-radius: 8px; }

  .card {
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 26px;
    padding: 20px 30px;
  }
  .label { font-size: 28px; color: var(--muted); margin: 0 0 8px; }

  .code {
    border: 4px dashed var(--brown);
    border-radius: 22px;
    padding: 8px 10px;
    text-align: center;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    font-size: 88px;
    font-weight: 700;
    letter-spacing: .1em;
    line-height: 1.15;
    color: var(--brown-dark);
    background: #fffaf3;
  }
  .coupon { margin: 12px 0 0; font-size: 38px; font-weight: 700; text-align: center; }

  .period { margin: 0; font-size: 52px; font-weight: 700; color: var(--brown-dark); }

  ul.rules { margin: 0; padding: 0; list-style: none; }
  ul.rules li {
    padding: 8px 0 8px 44px;
    position: relative;
    font-size: 38px;
    font-weight: 600;
  }
  ul.rules li + li { border-top: 2px solid var(--line); }
  ul.rules li::before {
    content: "";
    position: absolute;
    left: 8px; top: 27px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--brown);
  }

  .note {
    background: #fff6df;
    border: 2px solid #f0d9a0;
    color: #6d4c00;
    border-radius: 26px;
    padding: 18px 30px;
    font-size: 34px;
    font-weight: 600;
  }
  .note b { color: #8a5a00; }

  .warn {
    background: var(--warn-bg);
    border: 2px solid #f2b8b5;
    color: var(--warn);
    border-radius: 26px;
    padding: 16px 30px;
    font-weight: 800;
    font-size: 46px;
    text-align: center;
  }
  .warn small { display: block; font-size: 34px; font-weight: 700; margin-top: 2px; }
</style>
</head>
<body>
<main id="stage">

  <section class="hero">
    <div class="brand">SENBEI.STORE</div>
    <h1>已協助首次拆單</h1>
    <p>務必<b>「所有」</b>金額都完成下單才正確喔！</p>
  </section>

  <section class="card">
    <p class="label">結帳時請輸入此序號</p>
    <div class="code">NN95M-TP9</div>
    <p class="coupon">$1499折$100－Senbei.Store限定折扣碼</p>
  </section>

  <section class="card">
    <p class="label">使用期間</p>
    <p class="period">10/17 00:00 － 10/23</p>
  </section>

  <section class="card">
    <ul class="rules">
      <li>一個訂單限使用乙次</li>
      <li>結帳完一單，下一單仍可使用此序號</li>
    </ul>
  </section>

  <section class="note">
    折價卷採<b>「先用為主」</b>，<br>搶到後若沒有使用，額度被用完就無法再使用囉！
  </section>

  <section class="warn">
    務必記得繳費
    <small>沒有繳費成功折價卷會失效</small>
  </section>

</main>

<script>
  (function () {
    var stage = document.getElementById("stage");
    var W = 1080, H = 1440;
    function fit() {
      var vw = window.innerWidth, vh = window.innerHeight;
      var s = Math.min(vw / W, vh / H);
      stage.style.transform = "scale(" + s + ") translate(-50%, -50%)";
    }
    window.addEventListener("resize", fit);
    window.addEventListener("orientationchange", fit);
    fit();
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>商品上架｜iOPEN Mall 匯入檔</title>
<link rel="icon" href="data:," />
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root{--bg:#F5F3EE;--card:#fff;--ink:#1f1d1a;--mute:#7a746b;--line:#e3ded4;--accent:#8B1A1A;--ok:#2f7d4f;--warn:#b26a00;--err:#b42318}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  header h1{margin:0;font-size:16px;flex:1;min-width:140px}
  main{max-width:880px;margin:0 auto;padding:12px 16px 80px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h2{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  label{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
  input,textarea,select{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  textarea{min-height:64px;resize:vertical}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.ghost{background:transparent;border-color:rgba(255,255,255,.6);color:#fff}
  button.small{padding:3px 8px;font-size:12px}
  button:disabled{opacity:.4;cursor:not-allowed}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .mute{color:var(--mute);font-size:12px}
  .err{color:var(--err);font-size:12px}
  .warn{color:var(--warn);font-size:12px}
  .pill{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 8px;color:var(--mute)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:5px 6px;border-top:1px solid var(--line);text-align:left}
  td input{padding:4px 6px}
  .tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
  .tab{white-space:nowrap}
  .tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  details summary{cursor:pointer;color:var(--mute);font-size:12px;margin:6px 0}
</style>
</head>
<body>
<header>
  <h1>🛍️ 商品上架（iOPEN Mall 商品大量上傳）<span style="font-size:11px;font-weight:400;opacity:.8"> build 1020-B</span></h1>
  <button class="ghost small" id="btnClear">全部清空</button>
  <button class="primary" id="btnExport" style="background:#fff;color:var(--accent)">匯出 Excel</button>
</header>
<main>
  <div class="card">
    <div class="row">
      <strong>商品清單</strong><span class="mute" id="countInfo"></span>
      <span style="flex:1"></span>
      <button id="btnAdd">＋ 新增商品</button>
    </div>
    <div class="tabs" id="tabs" style="margin-top:10px"></div>
    <div class="mute">資料自動存在這個瀏覽器，下次開啟還在。同一份檔案可放多個商品一起匯出。</div>
  </div>
  <div id="editor"></div>
  <div class="card">
    <h2>全部商品共用設定</h2>
    <div class="grid">
      <div><label>商品分類編號</label><input id="gCategory" inputmode="numeric" /></div>
      <div><label>預計出貨天數（1–150）</label><input id="gShip" inputmode="numeric" /></div>
      <div><label>預設商品圖網址（沒填圖時使用）</label><input id="gDefImg" /></div>
      <div><label>商品圖片網址前綴（選填）</label><input id="gImgBase" placeholder="https://…/" /></div>
    </div>
    <div class="mute" style="margin-top:6px">圖片欄位若只填檔名，匯出時會自動接在前綴後面；填完整網址則不加。</div>
  </div>
  <div class="card">
    <h2>匯出預覽</h2>
    <div id="issues"></div>
    <div style="overflow-x:auto"><table id="preview"></table></div>
  </div>
</main>

<script>
// ───────── 資料結構 ─────────
const STORE_KEY = "listing_v1";
const GLOBAL_KEY = "listing_global_v1";
const MAX_NAME = 60, MAX_SKU = 20, MAX_OPT = 50;

function autoSku() {
  const d = new Date(), z = (n) => String(n).padStart(2, "0"), pre = z(d.getMonth() + 1) + z(d.getDate());
  const used = new Set(products.map(x => String(x.sku || "").toLowerCase()));
  for (let i = 1; i < 100; i++) { const c = pre + "-" + z(i); if (!used.has(c)) return c; }
  return pre + "-" + Date.now().toString(36).slice(-3);
}
function newProduct() {
  return {
    mode: "stock", preShip: "66", id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    name: "", sku: "", price: "", listPrice: "", cost: "",
    spec1Name: "顏色", opts: [], // opts = [{n:"嫩黃90", stock:"", price:""}]（顏色＋尺寸合成一個選項，各自庫存）
    genColors: "", genSizes: "", defStock: "",
    images: "", intro: "", desc: "",
    weight: "", len: "", wid: "", hei: "",
    online: "1",
  };
}
let products = [], activeId = null, glob = { category: "209", ship: "7", imgBase: "", defImg: "https://senbeistore.github.io/Livesenbei/IMG_0455.jpg" };

function load() {
  try { products = JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); } catch (e) { products = []; }
  try { glob = Object.assign(glob, JSON.parse(localStorage.getItem(GLOBAL_KEY) || "{}")); } catch (e) {}
  products.forEach(x => { if (x.preShip === "21" || x.preShip === undefined || x.preShip === "") x.preShip = "66"; });
  if (!products.length) { products = [newProduct()]; products[0].sku = autoSku(); }
  activeId = products[0].id;
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(products)); localStorage.setItem(GLOBAL_KEY, JSON.stringify(glob)); } catch (e) {}
}

// ───────── 核心：產生匯入列（純函式，可單獨測試） ─────────
function splitOpts(s) {
  const seen = new Set(), out = [];
  String(s || "").split(/[,，、\n]/).map(x => x.trim()).filter(Boolean).forEach(x => { if (!seen.has(x)) { seen.add(x); out.push(x); } });
  return out;
}
function combosOf(p) {
  migrate(p);
  const seen = new Set(), out = [];
  (p.opts || []).forEach(o => { const n = String(o.n || "").trim(); if (n && !seen.has(n)) { seen.add(n); out.push({ n, stock: o.stock, price: o.price }); } });
  return out;
}
// 舊版資料（規格1×規格2 / cells）轉成選項清單
function migrate(p) {
  if (p.opts) return;
  p.opts = [];
  const o1 = splitOpts(p.spec1Opts), o2 = splitOpts(p.spec2Opts);
  const add = (a, b) => { const k = a + "|" + b, c = (p.cells && p.cells[k]) || {}; p.opts.push({ n: a + b, stock: c.stock || "", price: c.price || "" }); };
  if (o1.length && o2.length) o1.forEach(a => o2.forEach(b => add(a, b)));
  else (o1.length ? o1 : o2).forEach(a => add(a, ""));
}
function expandOpts(p) {
  migrate(p);
  const cs = splitOpts(p.genColors), ss = splitOpts(p.genSizes);
  const have = new Set(p.opts.map(o => o.n));
  const names = [];
  if (cs.length && ss.length) cs.forEach(c => ss.forEach(z => names.push(c + z)));
  else (cs.length ? cs : ss).forEach(x => names.push(x));
  names.forEach(n => { if (!have.has(n)) { have.add(n); p.opts.push({ n, stock: "", price: "" }); } });
}
function toInt(v, d) { const n = parseInt(String(v).replace(/[^\d-]/g, ""), 10); return isNaN(n) ? d : n; }
function imgUrl(u, base) { u = String(u).trim(); if (!u) return ""; return /^https?:\/\//i.test(u) || !base ? u : base + u; }

function buildRows(list, g) {
  const rows = [], issues = [];
  const category = toInt(g.category, 209);
  let ship = toInt(g.ship, 7); ship = Math.min(150, Math.max(1, ship));
  list.forEach((p, pi) => {
    const label = p.name || ("商品 " + (pi + 1));
    const pre = p.mode === "preorder";
    let name = String(p.name || "").trim();
    const pfx = pre ? "預購｜" : "現貨｜";
    if (name && name.indexOf(pre ? "預購" : "現貨") !== 0 && name.indexOf("【預購】") !== 0) name = pfx + name;
    const sku = String(p.sku || "").trim();
    if (!name) { issues.push({ lv: "err", t: label + "：缺商品名稱" }); return; }
    if (name.length > MAX_NAME) issues.push({ lv: "err", t: label + "：商品名稱超過 " + MAX_NAME + " 字（" + name.length + "）" });
    if (!sku) { issues.push({ lv: "err", t: label + "：缺商品原始貨號" }); return; }
    if (sku.length > MAX_SKU - 4) issues.push({ lv: "warn", t: label + "：貨號偏長，加上規格序號可能超過 " + MAX_SKU + " 字" });
    const price = toInt(p.price, NaN);
    const combos = combosOf(p);
    let imgs = String(p.images || "").split(/\n/).map(x => imgUrl(x, g.imgBase)).filter(Boolean).slice(0, 10);
    if (!imgs.length && String(g.defImg || "").trim()) imgs = [String(g.defImg).trim()];
    if (!imgs.length) issues.push({ lv: "err", t: label + "：沒有商品圖，且共用設定的預設圖也是空的（商品圖(1) 為必填）" });
    if (!String(p.intro || "").trim()) issues.push({ lv: "err", t: label + "：缺商品簡介" });
    if (!String(p.desc || "").trim()) issues.push({ lv: "err", t: label + "：缺商品描述" });
    const listPrice = p.listPrice === "" ? "" : toInt(p.listPrice, "");
    const cost = p.cost === "" ? "" : toInt(p.cost, "");
    const base = (sellPrice) => [
      "", 3, 0, name, category, "", listPrice === "" ? sellPrice : listPrice, sellPrice, cost === "" ? sellPrice : cost, p.online === "0" ? 0 : 1,
    ];
    const shipD = pre ? Math.min(150, Math.max(1, toInt(p.preShip, 66))) : ship;
    const tail = (stock) => [
      String(p.intro || "").trim().replace(/\n/g, "<br>"), String(p.desc || "").trim().replace(/\n/g, "<br>"), "",
      toInt(p.weight, 1), toInt(p.len, 1), toInt(p.wid, 1), toInt(p.hei, 1), stock, shipD,
    ];
    const imgCols = Array.from({ length: 10 }, (_, i) => imgs[i] || "");
    if (!combos.length) {
      if (isNaN(price)) { issues.push({ lv: "err", t: label + "：缺售價" }); return; }
      const r = base(price); r[5] = sku;
      if (p.defStock === "" || p.defStock == null) { issues.push({ lv: "err", t: label + "：沒填" + (pre ? "接單上限" : "庫存") }); return; }
      rows.push([...r, "", "", "", "", "", ...imgCols, ...tail(toInt(p.defStock, 0))]);
      return;
    }
    combos.forEach((c, i) => {
      const sp = c.price !== undefined && c.price !== "" ? toInt(c.price, NaN) : price;
      if (isNaN(sp)) { issues.push({ lv: "err", t: label + "：「" + c.n + "」缺售價" }); return; }
      const stockRaw = c.stock !== undefined && c.stock !== "" ? c.stock : p.defStock;
      if (stockRaw === "" || stockRaw == null) { issues.push({ lv: "err", t: label + "：「" + c.n + "」沒填" + (pre ? "接單上限" : "庫存") }); return; }
      const stock = toInt(stockRaw, 0);
      const rowSku = sku + "-" + String(i + 1).padStart(2, "0");
      const mainSku = sku + "-" + "01";
      const r = base(sp); r[5] = rowSku;
      if (c.n.length > MAX_OPT) issues.push({ lv: "err", t: label + "：規格選項超過 " + MAX_OPT + " 字" });
      rows.push([...r, mainSku, p.spec1Name || "規格", c.n, "", "", ...imgCols, ...tail(stock)]);
    });
    if (combos.length > 1) {
      // 同一商品內，規格 1 + 規格 2 的組合不可重複（已由去重處理），這裡檢查數量上限
      if (combos.length > 200) issues.push({ lv: "warn", t: label + "：規格組合共 " + combos.length + " 筆，數量偏多" });
    }
  });
  const seenSku = {};
  list.forEach((p, pi) => { const k = String(p.sku || "").trim().toLowerCase(); if (!k) return; if (seenSku[k] !== undefined) issues.push({ lv: "err", t: "貨號重複：「" + p.sku + "」（" + (list[seenSku[k]].name || "商品 " + (seenSku[k] + 1)) + " 與 " + (p.name || "商品 " + (pi + 1)) + "）" }); else seenSku[k] = pi; });
  return { rows, issues };
}

const HEADER = [0, "*溫層設定", "稅別", "*商品名稱", "*商品分類編號", "*商品原始貨號", "商品定價", "*商品售價", "商品成本", "*商品上架",
  "主商品原始貨號", "商品規格1名稱", "商品規格1選項", "商品規格2名稱", "商品規格2選項",
  "*商品圖(1)", "商品圖(2)", "商品圖(3)", "商品圖(4)", "商品圖(5)", "商品圖(6)", "商品圖(7)", "商品圖(8)", "商品圖(9)", "商品圖(10)", "商品圖(11)",
  "*商品簡介", "*商品描述", "商品影片", "重量(g)", "長(cm)", "寬(cm)", "高(cm)", "*商品庫存", "預計出貨天數"];
const FORMAT_ROW = ["錯誤\n註記", "數字(2)", "數字(1)", "文字(60)", "數字(5)", "文字(20)", "數字(6)", "數字(6)", "數字(6)", "數字(1)", "文字(20)", "文字(50)", "文字(50)", "文字(50)", "文字(50)", "文字(500)", "文字(500)", "文字(500)", "文字(500)", "文字(500)", "文字(500)", "文字(500)", "文字(500)", "文字(500)", "文字(500)", "文字(500)", "文字(24000)", "文字(24000)", "文字(500)", "數字(8)", "數字(8)", "數字(8)", "數字(8)", "數字(6)", "數字(2)"];
// buildRows 的欄位順序：base(10) + 主貨號/規格(5) + 圖(10) + 簡介/描述/影片/重量長寬高/庫存/天數(9) = 34；補上第 26 欄「商品圖(11)」空白才與範本 35 欄對齊
function padRow(r) { const out = r.slice(0, 25); out.push(""); return out.concat(r.slice(25)); }

// ───────── 畫面 ─────────
const $ = (id) => document.getElementById(id);
let tplOpen = false;
const TPL_KEY = "listing_tpl_v1";
function loadTpl() { try { return JSON.parse(localStorage.getItem(TPL_KEY) || "[]"); } catch (e) { return []; } }
function saveTpl(t) { try { localStorage.setItem(TPL_KEY, JSON.stringify(t)); } catch (e) {} }
function tplOptions() { const t = loadTpl(); return t.length ? t.map((x, i) => `<option value="${i}">${esc(x.name)}</option>`).join("") : `<option value="">（尚無範本）</option>`; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function cur() { return products.find(p => p.id === activeId) || products[0]; }

function renderTabs() {
  $("tabs").innerHTML = products.map((p, i) =>
    `<button class="tab small ${p.id === activeId ? "on" : ""}" data-id="${p.id}">${esc(p.name || "商品 " + (i + 1))}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { activeId = b.dataset.id; renderAll(); });
  $("countInfo").textContent = products.length + " 個商品";
}

function field(label, key, p, extra) {
  return `<div><label>${label}</label><input data-k="${key}" value="${esc(p[key])}" ${extra || ""}></div>`;
}

function renderEditor() {
  const p = cur();
  const combos = combosOf(p);
  const cellRows = combos.map((c, i) => `<tr><td><input data-opt="${i}" data-f="n" value="${esc(c.n)}"></td>
      <td style="width:80px"><input data-opt="${i}" data-f="stock" inputmode="numeric" placeholder="${esc(p.defStock)}" value="${esc(c.stock == null ? "" : c.stock)}"></td>
      <td style="width:90px"><input data-opt="${i}" data-f="price" inputmode="numeric" placeholder="${esc(p.price)}" value="${esc(c.price == null ? "" : c.price)}"></td>
      <td style="width:36px"><button class="small" data-del="${i}">✕</button></td></tr>`).join("");
  $("editor").innerHTML = `
  <div class="card">
    <div class="row"><h2 style="margin:0">基本資料</h2><span style="flex:1"></span>
      <button class="small" id="btnDup">複製此商品</button><button class="small" id="btnDupColor">複製並換顏色</button><button class="small" id="btnDel">刪除</button></div>
    <div class="row" style="margin-top:8px">
      <button class="small tab ${p.mode !== "preorder" ? "on" : ""}" id="modeStock">現貨</button>
      <button class="small tab ${p.mode === "preorder" ? "on" : ""}" id="modePre">預購</button>
      <span class="mute">${p.mode === "preorder" ? "預購：名稱自動加【預購】，庫存＝可接單上限，出貨天數另外設定" : "現貨：庫存填實際數量，出貨天數用下方共用設定"}</span>
    </div>
    <div class="grid" style="margin-top:8px">
      <div style="grid-column:1/-1"><label>商品名稱（最多 60 字）<span id="nameLen" class="mute"></span></label><input data-k="name" value="${esc(p.name)}"></div>
      <div><label>商品原始貨號（最多 20 字，規格會自動加 -01、-02）</label><div class="row" style="flex-wrap:nowrap"><input data-k="sku" value="${esc(p.sku)}"><button class="small" id="btnSku" title="重新產生">🔄</button></div></div>
      ${field("售價（必填）", "price", p, 'inputmode="numeric"')}
      ${field("定價（選填，空白＝售價）", "listPrice", p, 'inputmode="numeric"')}
      ${field("成本（選填，空白＝售價）", "cost", p, 'inputmode="numeric"')}
      ${p.mode === "preorder" ? field("預購出貨天數（1–150）", "preShip", p, 'inputmode="numeric"') : ""}
      <div><label>上架狀態</label><select data-k="online"><option value="1" ${p.online !== "0" ? "selected" : ""}>上架</option><option value="0" ${p.online === "0" ? "selected" : ""}>不上架</option></select></div>
    </div>
  </div>
  <div class="card">
    <h2>規格${p.mode === "preorder" ? "與接單上限" : "與庫存"} <span class="pill">${combos.length ? combos.length + " 個選項" : "無規格（單一品項）"}</span></h2>
    <div class="mute" style="margin-bottom:6px">每個選項＝顏色＋尺寸（例：嫩黃90），各自填${p.mode === "preorder" ? "接單上限" : "庫存"}。沒有的組合直接刪掉，不會上架。</div>
    <div class="grid">
      ${field("規格名稱（買家看到的標題）", "spec1Name", p)}
      <div><label>顏色（逗號分隔）</label><input data-k="genColors" value="${esc(p.genColors)}" placeholder="嫩黃,牛油果綠,碳黑,紅"></div>
      <div><label>尺寸（逗號分隔，可留空）</label><input data-k="genSizes" value="${esc(p.genSizes)}" placeholder="90,120"></div>
      ${field(p.mode === "preorder" ? "預設接單上限" : "預設庫存（沒個別填的選項使用）", "defStock", p, 'inputmode="numeric"')}
    </div>
    <div class="row" style="margin:8px 0"><button class="small" id="btnExpand">⤵ 展開成選項</button><button class="small" id="btnAddOpt">＋ 新增一列</button><span class="mute">展開會把每個顏色配每個尺寸，已存在的不重複</span></div>
    ${combos.length ? `<table><tr><th>選項</th><th>${p.mode === "preorder" ? "接單上限" : "庫存"}</th><th>售價</th><th></th></tr>${cellRows}</table>` : ""}
  </div>
  <div class="card">
    <h2>圖片與說明</h2>
    <label>商品圖（一行一張，最多 10 張；留空＝使用預設橘色圖，上架後再到後台換）</label>
    <textarea data-k="images" placeholder="留空使用預設圖">${esc(p.images)}</textarea>
    <label style="margin-top:8px">商品簡介（必填；換行會轉成 &lt;br&gt;）</label>
    <textarea data-k="intro">${esc(p.intro)}</textarea>
    <label style="margin-top:8px">商品描述（必填）</label>
    <textarea data-k="desc" style="min-height:110px">${esc(p.desc)}</textarea>
    <details id="tplBox" ${tplOpen ? "open" : ""}><summary>文字範本（固定說明，存起來一鍵帶入）</summary>
      <div class="row" style="margin:6px 0"><select id="tplSel" style="flex:1;min-width:140px">${tplOptions()}</select>
        <button class="small" id="tplToIntro">加到簡介</button><button class="small" id="tplToDesc">加到描述</button><button class="small" id="tplDel">刪除範本</button></div>
      <div class="row"><input id="tplName" placeholder="範本名稱（例：現貨出貨說明）" style="flex:1;min-width:140px"><button class="small" id="tplSaveIntro">存目前簡介</button><button class="small" id="tplSaveDesc">存目前描述</button></div>
    </details>
    <details><summary>重量與尺寸（選填，空白＝1）</summary>
      <div class="grid">${field("重量(g)", "weight", p, 'inputmode="numeric"')}${field("長(cm)", "len", p, 'inputmode="numeric"')}${field("寬(cm)", "wid", p, 'inputmode="numeric"')}${field("高(cm)", "hei", p, 'inputmode="numeric"')}</div>
    </details>
  </div>`;
  $("editor").querySelectorAll("[data-k]").forEach(el => {
    el.oninput = () => { p[el.dataset.k] = el.value; save(); renderTabsLight(); renderPreview(); updNameLen(); };
  });
  $("editor").querySelectorAll("[data-opt]").forEach(el => {
    el.oninput = () => { p.opts[+el.dataset.opt][el.dataset.f] = el.value; save(); renderPreview(); };
  });
  $("editor").querySelectorAll("[data-del]").forEach(el => el.onclick = () => { p.opts.splice(+el.dataset.del, 1); save(); renderAll(); });
  $("btnExpand").onclick = () => { expandOpts(p); save(); renderAll(); };
  $("btnAddOpt").onclick = () => { migrate(p); p.opts.push({ n: "", stock: "", price: "" }); save(); renderAll(); };
  $("modeStock").onclick = () => { p.mode = "stock"; save(); renderAll(); };
  $("modePre").onclick = () => { p.mode = "preorder"; if (p.defStock === "") p.defStock = "50"; save(); renderAll(); };
  $("tplBox").ontoggle = () => { tplOpen = $("tplBox").open; };
  const addTo = (f) => { const t = loadTpl()[+$("tplSel").value]; if (!t) return; p[f] = (p[f] ? p[f] + "\n" : "") + t.text; save(); renderAll(); };
  $("tplToIntro").onclick = () => addTo("intro"); $("tplToDesc").onclick = () => addTo("desc");
  const saveFrom = (f) => { const n = $("tplName").value.trim(), txt = String(p[f] || "").trim(); if (!n || !txt) { alert("請填範本名稱，且該欄不能是空的。"); return; } const t = loadTpl(); const i = t.findIndex(x => x.name === n); if (i >= 0) t[i].text = txt; else t.push({ name: n, text: txt }); saveTpl(t); renderAll(); };
  $("tplSaveIntro").onclick = () => saveFrom("intro"); $("tplSaveDesc").onclick = () => saveFrom("desc");
  $("tplDel").onclick = () => { const t = loadTpl(), i = +$("tplSel").value; if (!t[i] || !confirm("刪除範本「" + t[i].name + "」？")) return; t.splice(i, 1); saveTpl(t); renderAll(); };
  $("btnSku").onclick = () => { p.sku = ""; p.sku = autoSku(); save(); renderAll(); };
  $("btnDup").onclick = () => { const c = JSON.parse(JSON.stringify(p)); c.id = newProduct().id; c.name = p.name ? p.name + "（複製）" : ""; c.sku = ""; c.sku = autoSku(); products.splice(products.indexOf(p) + 1, 0, c); activeId = c.id; save(); renderAll(); };
  $("btnDupColor").onclick = () => {
    const v = prompt("新的顏色（用逗號分隔）：", ""); if (v === null || !v.trim()) return;
    const c = JSON.parse(JSON.stringify(p)); c.id = newProduct().id; c.sku = ""; c.opts = []; c.genColors = v;
    if (!splitOpts(c.genSizes).length) { c.genSizes = ""; }
    products.splice(products.indexOf(p) + 1, 0, c); c.sku = autoSku(); expandOpts(c); activeId = c.id; save(); renderAll();
  };
  $("btnDel").onclick = () => { if (!confirm("刪除這個商品？")) return; products = products.filter(x => x !== p); if (!products.length) products = [newProduct()]; activeId = products[0].id; save(); renderAll(); };
  updNameLen();
}
function updNameLen() { const p = cur(), el = $("nameLen"); if (el) { const n = String(p.name || "").length; el.textContent = " " + n + "/60"; el.className = n > 60 ? "err" : "mute"; } }
function renderTabsLight() { renderTabs(); }

function renderPreview() {
  const { rows, issues } = buildRows(products, glob);
  $("issues").innerHTML = issues.length ? issues.map(i => `<div class="${i.lv}">${i.lv === "err" ? "✕" : "！"} ${esc(i.t)}</div>`).join("") : `<div class="mute">✓ 沒有發現問題</div>`;
  $("preview").innerHTML = `<tr><th>貨號</th><th>商品</th><th>規格</th><th>售價</th><th>庫存</th><th>出貨天數</th></tr>` + rows.map(r =>
    `<tr><td>${esc(r[5])}</td><td>${esc(r[3])}</td><td>${esc(r[11] ? r[11] + "：" + r[12] : "")}</td><td>${esc(r[7])}</td><td>${esc(r[32])}</td><td>${esc(r[33])}</td></tr>`).join("");
  $("btnExport").disabled = !rows.length || issues.some(i => i.lv === "err");
  return { rows, issues };
}
function renderAll() { renderTabs(); renderEditor(); renderPreview(); }

function exportXlsx() {
  const { rows, issues } = buildRows(products, glob);
  if (issues.some(i => i.lv === "err")) { alert("還有必填欄位沒填，請先看預覽區的紅字。"); return; }
  const data = [HEADER, FORMAT_ROW, ...rows.map(padRow)];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), "Data_Import_Items");
  const d = new Date(), z = (n) => String(n).padStart(2, "0");
  const ts = d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + z(d.getHours()) + z(d.getMinutes()) + z(d.getSeconds());
  XLSX.writeFile(wb, "iOpen_ProductImport_" + ts + ".xlsx", { bookSST: true });
  setTimeout(() => { if (confirm("已匯出。要清空商品清單嗎？（避免下次混到這次的商品）")) { products = [newProduct()]; products[0].sku = autoSku(); activeId = products[0].id; save(); renderAll(); } }, 600);
}

// ───────── 啟動 ─────────
if (typeof document !== "undefined" && document.getElementById("editor")) {
  load();
  $("gCategory").value = glob.category; $("gShip").value = glob.ship; $("gImgBase").value = glob.imgBase; $("gDefImg").value = glob.defImg;
  [["gCategory", "category"], ["gShip", "ship"], ["gImgBase", "imgBase"], ["gDefImg", "defImg"]].forEach(([id, k]) => $(id).oninput = () => { glob[k] = $(id).value; save(); renderPreview(); });
  $("btnAdd").onclick = () => { const p = newProduct(); p.sku = autoSku(); products.push(p); activeId = p.id; save(); renderAll(); };
  $("btnClear").onclick = () => { if (!confirm("清空所有商品？")) return; products = [newProduct()]; products[0].sku = autoSku(); activeId = products[0].id; save(); renderAll(); };
  $("btnExport").onclick = exportXlsx;
  renderAll();
}
</script>
</body>
</html>

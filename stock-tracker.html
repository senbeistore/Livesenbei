                      // 瀏覽/打勾模式：拆成「每件獨立一行」，避免 ×N 導致漏勾/多勾
                      (()=>{
                        const units=[];
                        o.allocItems.filter(it=>it.allocatedQty>0).forEach(it=>{
                          for(let u=0;u<it.allocatedQty;u++)units.push({it,unitIdx:u});
                        });
                        return units.map(({it,unitIdx},i)=>{
                          const uKey=unitPackKey(o.allocItems,it,unitIdx);
                          const isPacked=!!packed[o.oKey+"|"+uKey];
                          return(
                            <div key={i} style={{background:C.successSoft,borderRadius:8,padding:"6px 10px",marginBottom:4}}>
                              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
                                <span style={{fontSize:13,color:C.success,fontWeight:500,flex:1,textDecoration:isPacked?"line-through":"none",opacity:isPacked?0.45:1}}>{dispName(it)}</span>
                                <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                                  <strong style={{fontSize:13,color:C.success,opacity:isPacked?0.45:1}}>× 1</strong>
                                  <button onClick={()=>{if(window.confirm("⚠️ 退回待補貨\n\n「"+dispName(it)+"」1 件將：\n・從這位客人的可出貨移到待補貨\n・備貨中心的「已到貨」數量 −1\n\n適用於實際還沒到貨、卻誤標成到貨的情況。\n此動作會同步影響備貨中心，確定要繼續？"))returnToWaiting(o.oKey,it);}} title="實際未到貨，退回待補並扣回備貨中心到貨數"
                                    style={{border:`1px solid ${C.orange}`,color:C.orange,background:"#fff",borderRadius:7,padding:"4px 8px",fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>⏳ 退回待補</button>
                                  <button onClick={()=>{const cnt=o.allocItems.filter(x=>itemKey(x)===itemKey(it)).reduce((a,x)=>a+x.allocatedQty,0);let n=1;if(cnt>1){const v=window.prompt("「"+dispName(it)+"」目前可出 "+cnt+" 件，讓出幾件？",String(cnt));if(v===null)return;n=Math.min(cnt,Math.max(1,parseInt(v,10)||1));}else if(!window.confirm("「"+dispName(it)+"」1 件讓給下一位？\n\n・貨留在手上，備貨到貨數不變\n・這位客人改為待補，之後重新計算也不會再配給他\n・自動配給下一位在等這件的客人"))return;passToNext(o.oKey,it,n);}} title="客人無法取貨，貨讓給下一位"
                                    style={{border:`1px solid ${C.line}`,color:C.sub||"#666",background:"#fff",borderRadius:7,padding:"4px 8px",fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>➡️ 讓給下一位</button>
                                  <button onClick={()=>togglePacked(o.oKey,uKey)} title={isPacked?"取消裝袋":"標記已裝袋"}
                                    style={{width:28,height:28,padding:0,lineHeight:1,borderRadius:7,
                                      border:`2px solid ${isPacked?C.success:C.line}`,
                                      background:isPacked?C.success:"#fff",color:"#fff",
                                      fontSize:16,fontWeight:700,cursor:"pointer",
                                      display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                                    {isPacked?"✓":""}
                                  </button>
                                </div>
                              </div>
                            </div>
                          );
                        });
                      })()
                    )}
                  </div>
                )}

                {/* 待補貨品項（已出貨分頁不顯示） */}
                {catFilter!=="shipped"&&o.waitingItems.filter(it=>(needQty(it))>0).length>0&&(
                  <div style={{marginBottom:6}}>
                    <div style={{fontSize:11,color:C.orange,fontWeight:700,marginBottom:4}}>⏳ 待補貨</div>
                    {o.waitingItems.filter(it=>(needQty(it))>0).map((it,i)=>{
                      const sku=flatKey(it);
                      const snk=normalizedKey(it);
                      const otherUsage=Math.max(usage[sku]||0,usage[snk]||0);
                      const available=Math.max(0,Math.max(stockMap[sku]||0,stockMap[snk]||0)-otherUsage);
                      const waitQty=needQty(it);
                      return(
                        <div key={i} style={{background:C.orangeSoft,borderRadius:8,padding:"6px 10px",marginBottom:4}}>
                          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
                            <span style={{fontSize:13,color:C.orange,flex:1}}>{dispName(it)}</span>
                            {(()=>{const arriveBtn=(<button onClick={()=>{if(window.confirm("📦 標記到貨\n\n「"+dispName(it)+"」1 件將：\n・從待補貨移到可出貨\n・備貨中心的「已到貨」數量 +1\n\n適用於貨已實際到、但備貨中心還沒更新的情況。\n此動作會同步影響備貨中心，確定要繼續？"))markArrivedFromWaiting(o.oKey,it);}} title="貨已到，補進可出貨並同步備貨中心到貨數"
                              style={{border:`1px solid ${C.success}`,color:C.success,background:"#fff",borderRadius:7,padding:"4px 8px",fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>📦 標記到貨</button>);
                            const notInStock=matchItemIdx(items,it)<0;
                            const addStockBtn=notInStock?(<button onClick={()=>{if(window.confirm("➕ 加入備貨清單\n\n「"+dispName(it)+"」"+waitQty+" 件\n\n備貨清單目前沒有這個品項（例如來源品名不同）。\n將以「未訂購、已到貨 0」建立，方便追蹤訂貨與到貨。\n不會變動配貨內容，確定要建立？"))onAddToStock&&onAddToStock([{item:it,qty:waitQty}]);}} title="備貨清單沒有此品項，建立以便追蹤訂貨"
                              style={{border:`1px solid ${C.stamp}`,color:C.stamp,background:"#fff",borderRadius:7,padding:"4px 8px",fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>➕ 加入備貨</button>):null;
                            const reshipBtn=hasShipments?(<button onClick={()=>{if(window.confirm("📮 加入補寄清單\n\n「"+dispName(it)+"」"+waitQty+" 件\n\n這位客人的訂單已寄出，此品項將建立補寄記錄，\n可在「補寄」分頁填寫寄件資訊與補寄單號。\n確定要建立？"))addReship(c.account,c.name,it,waitQty);}} title="訂單已寄出，此缺件另外補寄"
                              style={{border:`1px solid ${C.info}`,color:C.info,background:"#fff",borderRadius:7,padding:"4px 8px",fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>📮 加入補寄</button>):null;
                            return available>0?(
                              <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0,flexWrap:"wrap",justifyContent:"flex-end"}}>
                                <span style={{fontSize:12,color:C.inkMuted}}>待 {waitQty}</span>
                                {addStockBtn}
                                {reshipBtn}
                                {arriveBtn}
                                <button onClick={()=>updateAllocQty(o.oKey,sku,available)}
                                  style={{background:C.success,color:"#fff",border:"none",borderRadius:6,padding:"3px 10px",fontSize:12,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>
                                  補入{available}件
                                </button>
                              </div>
                            ):(
                              <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0,flexWrap:"wrap",justifyContent:"flex-end"}}>
                                <span style={{fontSize:13,color:C.orange}}>× {waitQty}</span>
                                {addStockBtn}
                                {reshipBtn}
                                {arriveBtn}
                              </div>
                            );})()}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                {o.skipItems&&Object.keys(o.skipItems).length>0&&(<div style={{fontSize:11,color:C.inkMuted,marginBottom:4}}>已讓出：{Object.entries(o.skipItems).map(([ik,n])=>(<span key={ik} style={{marginRight:8}}>{ik.split("|||").filter(Boolean).join(" ")} ×{n} <button onClick={()=>cancelSkip(o.oKey,ik)} style={{fontSize:11,color:C.info,border:`1px solid ${C.info}`,background:"#fff",borderRadius:8,padding:"0 6px",cursor:"pointer"}}>取消讓出</button></span>))}</div>)}
                {/* 出貨操作列（有可出貨品項就顯示） */}
                {catFilter!=="shipped"&&canShip&&(
                  <div style={{marginTop:6}}>
                    <div style={{display:"flex",gap:6,marginBottom:6}}>
                      <button onClick={()=>setEditingKey(editingKey===o.oKey?null:o.oKey)} style={{background:editingKey===o.oKey?C.info:C.surface,color:editingKey===o.oKey?"#fff":C.inkMuted,border:`1px solid ${editingKey===o.oKey?C.info:C.line}`,borderRadius:8,padding:"6px 10px",fontSize:12,cursor:"pointer"}}>
                        {editingKey===o.oKey?"完成調整":"調整配貨"}
                      </button>
                    </div>
                    {(()=>{const typed=shipInputs[o.oKey];const ords=(iopenInfo&&iopenInfo.orders)||[];const isShippedOrd=(x)=>c.orders.some(oo=>(oo.shipments||[]).some(s=>String(s.orderNo)===String(x.orderNo)));const nextOrd=(typed&&ords.find(x=>x.orderNo===typed))||ords.find(x=>!isShippedOrd(x))||ords[shipments.length];if(!nextOrd||!(nextOrd.store||nextOrd.amount>0))return null;
                      const prods=o.allocItems.filter(it=>it.allocatedQty>0).map(it=>dispName(it)+(it.allocatedQty>1?" ×"+it.allocatedQty:""));
                      if(iopenInfo&&iopenInfo.customItems){const _sci2=(c.orders[0]&&c.orders[0].shippedCI)||[];iopenInfo.customItems.forEach(ci=>{const ck=custKey(ci);if(_sci2.indexOf(ck)===-1&&packed[o.oKey+"|CI|"+ck])prods.push(ci.prod+(ci.spec1?" "+ci.spec1:"")+(ci.spec2?" "+ci.spec2:""));});}
                      const cpk=o.oKey+"|"+nextOrd.orderNo;
                      return(
                      <div style={{fontSize:12,color:C.inkMuted,marginBottom:4,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                        {nextOrd.store&&<span>📍{nextOrd.store}</span>}
                        {nextOrd.amount>0&&<span style={{fontFamily:"monospace",fontWeight:700,color:C.ink}}>${nextOrd.amount}</span>}
                        <button onClick={()=>{navigator.clipboard.writeText(buildShipNotice(nextOrd.orderNo,nextOrd.store,prods)).then(()=>{setCopiedKey(cpk);setTimeout(()=>setCopiedKey(""),1800);}).catch(()=>{});}} style={{fontSize:11,color:copiedKey===cpk?C.success:C.info,border:`1px solid ${copiedKey===cpk?C.success:C.info}`,background:copiedKey===cpk?C.successSoft:C.infoSoft,borderRadius:10,padding:"2px 8px",cursor:"pointer"}}>{copiedKey===cpk?"\u2713 已複製":"\ud83d\udccb 複製通知"}</button>
                      </div>
                      );})()}
                    {(()=>{
                      const ords=(iopenInfo&&iopenInfo.orders)||[];const typed=shipInputs[o.oKey];
                      const isShippedOrd=(x)=>c.orders.some(oo=>(oo.shipments||[]).some(s=>String(s.orderNo)===String(x.orderNo)));
                      const nextOrd=(typed&&ords.find(x=>x.orderNo===typed))||ords.find(x=>!isShippedOrd(x))||ords[shipments.length];
                      if(!nextOrd||!((nextOrd.listPrice||nextOrd.amount)>0))return null;
                      const units=[];o.allocItems.filter(it=>it.allocatedQty>0).forEach(it=>{for(let u=0;u<it.allocatedQty;u++)units.push({key:o.oKey+"|"+unitPackKey(o.allocItems,it,u),price:Math.round(it.price||0)});});
                      if(!units.some(x=>x.price>0))return null;
                      const packedVal=units.filter(x=>packed[x.key]).reduce((a,x)=>a+x.price,0);
                      const totalVal=units.reduce((a,x)=>a+x.price,0);
                      const remainOrds=ords.filter(x=>!isShippedOrd(x));
                      const target=Math.round(nextOrd.listPrice||nextOrd.amount);
                      function autoPick(){
                        const maxP=Math.max.apply(null,units.map(x=>x.price));const cap=target+maxP;
                        const dp=new Array(cap+1).fill(null);dp[0]=[];
                        units.forEach((x,i)=>{for(let sm=cap;sm>=x.price;sm--){if(dp[sm]===null&&dp[sm-x.price]!==null&&x.price>0)dp[sm]=dp[sm-x.price].concat(i);}});
                        let best=-1;for(let sm=1;sm<=cap;sm++){if(dp[sm]===null)continue;if(best<0||Math.abs(sm-target)<Math.abs(best-target)||(Math.abs(sm-target)===Math.abs(best-target)&&sm>=target))best=sm;}
                        const chosen=new Set(best>0?dp[best]:[]);units.forEach((x,i)=>{if(!(x.price>0))chosen.add(i);});
                        setPacked(pv=>{const n={...pv};units.forEach((x,i)=>{n[x.key]=chosen.has(i);});return n;});
                      }
                      const diff=packedVal-target;
                      return(<div style={{background:C.infoSoft,border:`1px solid ${C.info}`,borderRadius:8,padding:"8px 10px",marginBottom:6,fontSize:12,color:C.ink}}>
                        <div style={{display:"flex",flexWrap:"wrap",gap:10,alignItems:"center"}}>
                          <span>本單 <strong>${target}</strong></span>
                          <span>已勾 <strong style={{color:packedVal===0?C.inkMuted:Math.abs(diff)<=Math.max(150,target*0.1)?C.success:C.orange}}>${packedVal}</strong></span>
                          <span style={{color:C.inkMuted}}>可出貨合計 ${totalVal}</span>
                          <button onClick={autoPick} style={{marginLeft:"auto",background:C.info,color:"#fff",border:"none",borderRadius:8,padding:"5px 10px",fontSize:12,fontWeight:600,cursor:"pointer"}}>自動湊 ${target}</button>
                        </div>
                        {remainOrds.length>1&&<div style={{color:C.inkMuted,marginTop:4}}>未出貨子單：{remainOrds.map(x=>"$"+Math.round(x.listPrice||x.amount||0)).join("、")}</div>}
                      </div>);
                    })()}
                    {(()=>{
                      const anyAllocPacked=o.allocItems.some(it=>{if(!(it.allocatedQty>0))return false;for(let u=0;u<it.allocatedQty;u++)if(packed[o.oKey+"|"+unitPackKey(o.allocItems,it,u)])return true;return false;});
                      const _sci=(c.orders[0]&&c.orders[0].shippedCI)||[];
                      const anyCustPacked=(iopenInfo&&iopenInfo.customItems?iopenInfo.customItems:[]).some(ci=>{const ck=custKey(ci);return _sci.indexOf(ck)===-1&&!!packed[o.oKey+"|CI|"+ck];});
                      const anyPacked=anyAllocPacked||anyCustPacked;
                      const hasInput=!!(shipInputs[o.oKey]&&shipInputs[o.oKey].trim());
                      const canConfirm=hasInput&&anyPacked;
                      return(
                    <div style={{display:"flex",gap:6}}>
                      <input type="text" value={shipInputs[o.oKey]||""} onChange={e=>setShipInputs(p=>({...p,[o.oKey]:e.target.value}))}
                        placeholder={(iopenInfo&&iopenInfo.orders&&iopenInfo.orders[shipments.length]&&iopenInfo.orders[shipments.length].orderNo)||(hasShipments?"填入第二次出貨單號":"填入出貨單號")}
                        style={{flex:1,border:`1px solid ${C.line}`,borderRadius:8,padding:"7px 10px",fontSize:13,minWidth:0}}/>
                      <button onClick={()=>{
                        if(!hasInput)return;
                        if(!anyPacked){alert("請先勾選已裝袋的品項（含客訂品項），才能出貨");return;}
                        confirmShipment(o.oKey,shipInputs[o.oKey].trim());
                      }}
                        disabled={!canConfirm}
                        style={{background:canConfirm?C.success:"#ccc",color:"#fff",border:"none",borderRadius:8,padding:"7px 12px",fontSize:13,fontWeight:600,cursor:canConfirm?"pointer":"default",whiteSpace:"nowrap"}}>
                        確認出貨
                      </button>
                    </div>
                      );})()}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );})}
    </div>
  );
}

// ── 主應用 ──
function CountView({items,onApply,onClose}){
  const prods=useMemo(()=>{const m={};items.forEach(it=>{const has=isOrderedMarked(it)||(it.arrivedQty||0)>0;if(!has)return;if(effOrderedQty(it)<=0&&(it.arrivedQty||0)<=0)return;(m[gProd(it)]=m[gProd(it)]||[]).push(it);});return Object.keys(m).sort((a,b)=>a.localeCompare(b)).map(k=>({prod:k,rows:m[k].slice().sort((a,b)=>{const c=getGroupKey(a).localeCompare(getGroupKey(b));return c!==0?c:getSortSize(a)-getSortSize(b);})}));},[items]);
  const [sel,setSel]=useState("");
  const [draft,setDraft]=useState({});
  const [closed,setClosed]=useState(true);
  const cur=prods.find(p=>p.prod===sel);
  const get=(id)=>draft[id]||{add:0,defect:0};
  const setD=(id,patch)=>setDraft(pv=>({...pv,[id]:{...get(id),...pv[id],...patch}}));
  function fillAll(){const d={};cur.rows.forEach(it=>{d[it.id]={add:Math.max(0,effOrderedQty(it)-(it.arrivedQty||0)),defect:(draft[it.id]||{}).defect||0};});setDraft(pv=>({...pv,...d}));}
  function finish(){
    if(!cur)return;
    let shortN=0,addN=0;
    cur.rows.forEach(it=>{const d=get(it.id);addN+=d.add;const tot=(it.arrivedQty||0)+d.add;if(closed&&effOrderedQty(it)>tot)shortN+=effOrderedQty(it)-tot;});
    const msg=`「${cur.prod}」本次共收 ${addN} 件。`+(closed?(shortN>0?`\n有 ${shortN} 件短少，會列入短少追蹤。`:"\n數量完全相符。"):"\n未收齊的部分仍視為在途（不算短少）。")+"\n確定完成清點？";
    if(!window.confirm(msg))return;
    const now=new Date().toISOString();
    const ups=cur.rows.map(it=>{const d=get(it.id);const tot=(it.arrivedQty||0)+d.add;const eff=effOrderedQty(it);const patch={arrivedQty:tot,defectQty:(it.defectQty||0)+d.defect,allArrived:eff>0&&tot>=eff};
      if(closed)patch.counted=true;
      if(d.add>0){patch.arrivalLog=[...(it.arrivalLog||[]),{ts:now,d:d.add,total:tot}];if(!it.firstArrivedTs)patch.firstArrivedTs=now;patch.arrivedTs=now;}
      return{id:it.id,patch};});
    onApply(ups);
    setDraft({});
    alert("已完成清點並儲存");
  }
  const btn={border:`1px solid ${C.line}`,background:C.surface,color:C.ink,borderRadius:8,width:36,height:36,fontSize:18,cursor:"pointer"};
  return(<div style={{maxWidth:640,margin:"0 auto",padding:"14px"}}>
    <div style={{display:"flex",alignItems:"center",marginBottom:10}}><div style={{fontWeight:700,fontSize:16,color:C.ink}}>📦 到貨清點</div><button onClick={onClose} style={{marginLeft:"auto",border:`1px solid ${C.line}`,background:C.surface,color:C.inkMuted,borderRadius:8,padding:"6px 12px",fontSize:13,cursor:"pointer"}}>返回</button></div>
    <div style={{fontSize:12,color:C.inkMuted,marginBottom:8}}>選一個商品，逐款輸入「本次實收」與「瑕疵」，系統會比對應收並標出短少。</div>
    <select value={sel} onChange={e=>{setSel(e.target.value);setDraft({});}} style={{width:"100%",border:`1px solid ${C.line}`,borderRadius:10,padding:"10px",fontSize:14,background:C.surface,color:C.ink,marginBottom:12}}>
      <option value="">選擇要清點的商品…</option>
      {prods.map(p=>{const sh=p.rows.reduce((a,i)=>a+shortQty(i),0);const wait=p.rows.reduce((a,i)=>a+Math.max(0,effOrderedQty(i)-(i.arrivedQty||0)),0);return(<option key={p.prod} value={p.prod}>{displayProd(p.prod)}（待收 {wait}{sh>0?`／短少 ${sh}`:""}）</option>);})}
    </select>
    {!cur&&<div style={{color:C.inkMuted,textAlign:"center",padding:"32px 0",fontSize:13}}>{prods.length===0?"目前沒有已訂購的品項可清點":"請先選擇商品"}</div>}
    {cur&&(<div>
      <div style={{display:"flex",gap:8,marginBottom:8}}><button onClick={fillAll} style={{border:`1px solid ${C.success}`,color:C.success,background:"#f0faf4",borderRadius:8,padding:"6px 12px",fontSize:12,cursor:"pointer"}}>照單全收（填入全部應收）</button><button onClick={()=>setDraft({})} style={{border:`1px solid ${C.line}`,color:C.inkMuted,background:C.surface,borderRadius:8,padding:"6px 12px",fontSize:12,cursor:"pointer"}}>全部歸零</button></div>
      {cur.rows.map(it=>{const d=get(it.id);const eff=effOrderedQty(it);const prior=it.arrivedQty||0;const tot=prior+d.add;const diff=tot-eff;const label=[it.color,it.size,it.style].filter(Boolean).join(" · ")||it.product;
        return(<div key={it.id} style={{background:C.surface,border:`1px solid ${diff<0?"#FCA5A5":C.line}`,borderRadius:12,padding:"10px 12px",marginBottom:8}}>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span style={{fontWeight:700,fontSize:14,color:C.ink}}>{label}</span>
            <span style={{fontSize:12,color:C.inkMuted}}>應收 {eff}・先前已收 {prior}</span>
            <span style={{marginLeft:"auto",fontSize:12,fontWeight:700,color:diff===0?C.success:diff<0?"#B91C1C":C.orange}}>{diff===0?"✓ 相符":diff<0?`缺 ${-diff}`:`多 ${diff}`}</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginTop:8,flexWrap:"wrap"}}>
            <span style={{fontSize:12,color:C.inkMuted}}>本次收到</span>
            <button style={btn} onClick={()=>setD(it.id,{add:Math.max(0,d.add-1)})}>−</button>
            <input type="number" min="0" value={d.add} onChange={e=>setD(it.id,{add:Math.max(0,parseInt(e.target.value,10)||0)})} style={{width:56,height:36,border:`1px solid ${C.info}`,borderRadius:8,textAlign:"center",fontSize:15,fontWeight:700,background:"#EFF6FC",color:C.info}}/>
            <button style={btn} onClick={()=>setD(it.id,{add:d.add+1})}>＋</button>
            <span style={{fontSize:12,color:"#B91C1C",marginLeft:6}}>瑕疵</span>
            <input type="number" min="0" value={d.defect} onChange={e=>setD(it.id,{defect:Math.max(0,parseInt(e.target.value,10)||0)})} style={{width:46,height:36,border:`1px solid ${d.defect>0?"#B91C1C":C.line}`,borderRadius:8,textAlign:"center",fontSize:14,background:C.bg}}/>
          </div>
        </div>);})}
      <label style={{display:"flex",alignItems:"flex-start",gap:8,margin:"10px 0",cursor:"pointer"}}><input type="checkbox" checked={closed} onChange={e=>setClosed(e.target.checked)} style={{width:20,height:20,marginTop:1}}/><span style={{fontSize:13,color:C.ink}}>這批貨已全部到齊，未收齊的算<strong>短少</strong>（若還有貨在路上，請取消勾選）</span></label>
      <button onClick={finish} style={{width:"100%",background:C.stamp,color:"#fff",border:"none",borderRadius:10,padding:"12px",fontSize:15,fontWeight:700,cursor:"pointer"}}>完成清點並儲存</button>
    </div>)}
  </div>);
}

// ── 客人異動總表：集中列出所有取消／改色，勾選已通知或已在平台修改 ──

// ── 新增花色／尺寸：先把選項建好（需求 0），之後「改成別款」就能直接選 ──
function AddVariantModal({item,items,onApply,onClose}){
  const src=itemSource(item);const pool0=items.filter(x=>itemSource(x)===src);
  const groups=[];pool0.forEach(x=>{const g=gProd(x);if(!groups.includes(g))groups.push(g);});groups.sort((a,b)=>(a===gProd(item)?-1:b===gProd(item)?1:a.localeCompare(b,"zh-Hant")));
  const[prod,setProd]=useState(gProd(item));const[colorsTxt,setColorsTxt]=useState("");const[sizesTxt,setSizesTxt]=useState("");
  const pool=pool0.filter(x=>gProd(x)===prod);
  const useStyle=pool.filter(x=>!x.color&&x.style).length>pool.filter(x=>x.color).length;
  const splitList=(t)=>String(t||"").split(/[,，、\n]+/).map(x=>x.trim()).filter(Boolean);
  const sizes=(()=>{const out=[];String(sizesTxt||"").split(/[,，、\s]+/).filter(Boolean).forEach(tok=>{const m=tok.match(/^(\d+)\s*[-~～－]\s*(\d+)$/);if(m){const a=parseInt(m[1],10),b=parseInt(m[2],10);for(let v=a;v<=b;v+=10)out.push(String(v));}else out.push(tok);});return out.filter((v,i,a)=>a.indexOf(v)===i);})();
  const exColors=[];pool.forEach(x=>{const k=(x.style||"")+"\u0001"+(x.color||"");if(!exColors.includes(k))exColors.push(k);});
  const exSizes=[];pool.forEach(x=>{const z=x.size||"";if(!exSizes.includes(z))exSizes.push(z);});
  const colorKeys=splitList(colorsTxt).length?splitList(colorsTxt).map(c=>useStyle?c+"\u0001":"\u0001"+c):exColors;
  const useSizes=sizes.length?sizes:exSizes;
  const plan=[];colorKeys.forEach(k=>{const[st,co]=k.split("\u0001");useSizes.forEach(z=>{if(pool.some(x=>(x.style||"")===st&&(x.color||"")===co&&(x.size||"")===z))return;plan.push({style:st,color:co,size:z});});});
  const btn={fontSize:12,borderRadius:6,padding:"6px 12px",cursor:"pointer",border:`1px solid ${C.line}`,background:C.surface,color:C.ink};
  const inp={width:"100%",boxSizing:"border-box",border:`1px solid ${C.line}`,borderRadius:8,padding:"8px",fontSize:14,marginTop:4};
  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:70,display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"20px 10px"}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{background:C.surface,borderRadius:14,maxWidth:520,width:"100%",padding:16}}>
      <div style={{display:"flex",justifyContent:"space-between"}}><b style={{fontSize:16,color:C.ink}}>＋新增花色／尺寸</b><button style={btn} onClick={onClose}>關閉</button></div>
      <div style={{fontSize:11,color:C.inkMuted,marginTop:6,lineHeight:1.6}}>先把選項建好（需求 0，不影響任何訂單），之後在「改成別款」就能直接選。沒有需求的品項不會出現在清單上。</div>
      <div style={{marginTop:10,fontSize:12,color:C.inkMuted}}>商品</div>
      <select value={prod} onChange={e=>setProd(e.target.value)} style={{...inp,padding:"8px"}}>{groups.map(g=><option key={g} value={g}>{g}</option>)}</select>
      <div style={{marginTop:10,fontSize:12,color:C.inkMuted}}>新花色（多個用「、」或逗號分開；只想補尺寸就留空）</div>
      <input value={colorsTxt} onChange={e=>setColorsTxt(e.target.value)} placeholder="例：淺綠小狗、淡藍機器人、藍灰小車" style={inp}/>
      <div style={{marginTop:10,fontSize:12,color:C.inkMuted}}>尺寸（可寫範圍 90-140，每 10 一階；或 80、90；留空＝沿用此商品現有尺寸）</div>
      <input value={sizesTxt} onChange={e=>setSizesTxt(e.target.value)} placeholder="例：90-140" style={inp}/>
      <div style={{marginTop:10,fontSize:12,color:C.ink,lineHeight:1.6}}>{plan.length?<>將新增 <b>{plan.length}</b> 個品項：{plan.slice(0,8).map(x=>[x.color,x.size,x.style].filter(Boolean).join("·")).join("、")}{plan.length>8?"…":""}</>:<span style={{color:C.inkMuted}}>沒有需要新增的（都已存在，或尚未填寫）</span>}</div>
      <button disabled={!plan.length} onClick={()=>{onApply(prod,plan);onClose();}} style={{...btn,marginTop:12,background:C.stamp,color:"#fff",border:"none",fontWeight:700,padding:"8px 16px",opacity:plan.length?1:.5}}>新增</button>
    </div></div>);
}

// ── 斷貨／改色／取消：逐位客人處理，並同步修改本工具內的訂單資料 ──
function ChangeModal({item,items,parsed,iopenData,savedAlloc,changes,onApply,onClose,onAddVariant}){
  const fk=flatKey(item);
  const rows=[];
  if(parsed&&parsed.orders){
    parsed.orders.forEach((o,oi)=>{o.items.forEach((ln,li)=>{
      if(flatKey(ln)!==fk)return;
      const ex=savedAlloc&&savedAlloc[makeOrderKey(o.customerKey,o.items)];
      const shipped=!!(ex&&((ex.shipments&&ex.shipments.length>0)||ex.shippedAt));
      const c=parsed.customers[o.customerKey]||{};
      rows.push({oi,li,qty:ln.qty,price:ln.price||0,account:c.account||o.customerKey,name:c.name||"",shipped});
    });});
  }
  // iOPEN 品項：客人資料在 iopenData[帳號].customItems（不在直播訂單內），一樣可以逐位客人改款／取消
  if(itemSource(item)==="iopen"&&iopenData){
    const shippedCI={};Object.values(savedAlloc||{}).forEach(o=>{(o.shippedCI||[]).forEach(k=>{shippedCI[k]=1;});});
    Object.keys(iopenData).forEach(ig=>{
      if(ig.indexOf("__")===0)return;const t=iopenData[ig];if(!t||!Array.isArray(t.customItems))return;
      t.customItems.forEach((ci,li)=>{
        if((ci.prod||"")!==(item.product||"")||(ci.spec1||"")!==(item.color||"")||(ci.spec2||"")!==(item.size||""))return;
        rows.push({io:true,ig,oi:"io|"+ig,li,qty:ci.qty||1,price:0,account:ig,name:"",shipped:!!shippedCI[custKey(ci)]});
      });
    });
  }
  // 找不到逐位客人（手動建立的 iOPEN 品項）：用一列「只調整需求件數」讓你把件數搬到別的花色／尺寸
  if(itemSource(item)==="iopen"&&!rows.length&&(item.qty||0)>0)rows.push({io:true,ig:"",oi:"io|",li:0,qty:item.qty,price:0,account:"（這個品項沒有客人資料，只調整需求件數）",name:"",shipped:false});
  // 目標清單：可選任一商品（預設同商品）的「所有顏色 × 所有尺寸」；備貨清單裡還沒有的組合選了之後會自動新增品項
  const poolAll=itemSource(item)==='iopen'?items.slice():items.filter(x=>itemSource(x)===itemSource(item));
  const groups=[];poolAll.forEach(x=>{const g=gProd(x);if(!groups.includes(g))groups.push(g);});
  groups.sort((a,b)=>(a===gProd(item)?-1:b===gProd(item)?1:a.localeCompare(b,"zh-Hant")));
  const SEP="\u0001";
  const baseProd=(gp)=>{const m={};poolAll.filter(x=>gProd(x)===gp).forEach(x=>{m[x.product]=(m[x.product]||0)+1;});return Object.keys(m).sort((a,b)=>m[b]-m[a])[0]||gp;};
  const targetsFor=(gp)=>{
    const sameP=poolAll.filter(x=>gProd(x)===gp);
    const colorKeys=[],sizeKeys=[];
    sameP.forEach(x=>{const ck=(x.style||"")+SEP+(x.color||"");if(!colorKeys.includes(ck))colorKeys.push(ck);const z=x.size||"";if(!sizeKeys.includes(z))sizeKeys.push(z);});
    sizeKeys.sort((a,b)=>sizeOrder(a)-sizeOrder(b));
    const out=[];const bp=baseProd(gp);
    colorKeys.forEach(ck=>{const[st,co]=ck.split(SEP);sizeKeys.forEach(z=>{
      const ex=sameP.find(x=>(x.style||"")===st&&(x.color||"")===co&&(x.size||"")===z);
      if(ex){if(ex.id===item.id)return;out.push({id:ex.id,color:co,size:z,style:st,stock:ex.stockQty||0,isNew:false});}
      else out.push({id:"new"+SEP+bp+SEP+gp+SEP+st+SEP+co+SEP+z,color:co,size:z,style:st,stock:0,isNew:true});
    });});
    out.sort((a,b)=>a.color.localeCompare(b.color,"zh-Hant")||sizeOrder(a.size)-sizeOrder(b.size));
    return out;
  };
  const[dec,setDec]=useState({});
  const[done,setDone]=useState(null);
  const get=(r)=>dec[r.oi+"_"+r.li]||{act:"keep",n:r.qty,to:"",tp:gProd(item)};
  const set=(r,patch)=>setDec(p=>({...p,[r.oi+"_"+r.li]:{...get(r),...patch}}));
  const all=(act,to)=>{const m={};rows.filter(r=>!r.shipped).forEach(r=>{m[r.oi+"_"+r.li]={act,n:r.qty,to:to||"",tp:gProd(item)};});setDec(m);};
  const btn={fontSize:12,borderRadius:6,padding:"4px 10px",cursor:"pointer",border:`1px solid ${C.line}`,background:C.surface,color:C.ink};
  const todo=rows.filter(r=>!r.shipped&&get(r).act!=="keep"&&(get(r).act==="cancel"||(get(r).to&&(get(r).to!=="__custom__"||String(get(r).cc||"").trim()))));
  const apply=()=>{
    const ds=todo.map(r=>({io:!!r.io,ig:r.ig,oi:r.oi,li:r.li,act:get(r).act,n:Math.max(1,Math.min(r.qty,parseInt(get(r).n,10)||r.qty)),to:get(r).to==="__custom__"?"new"+SEP+baseProd(get(r).tp||gProd(item))+SEP+(get(r).tp||gProd(item))+SEP+((get(r).tp||gProd(item))===gProd(item)&&!(item.style&&!item.color)?(item.style||""):(((get(r).tp||gProd(item))===gProd(item))?String(get(r).cc).trim():""))+SEP+((get(r).tp||gProd(item))===gProd(item)&&item.style&&!item.color?"":String(get(r).cc).trim())+SEP+(String(get(r).cz||"").trim()||item.size||""):get(r).to}));
    setDone(onApply(item,ds));
  };
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:60,display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"20px 10px"}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.surface,borderRadius:14,maxWidth:560,width:"100%",padding:"16px 16px 20px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontWeight:800,fontSize:16,color:C.ink}}>🚫 斷貨／改色／取消</div>
          <button onClick={onClose} style={btn}>關閉</button>
        </div>
        <div style={{fontSize:13,color:C.ink,marginTop:6,fontWeight:700}}>{dispName(item)}　<span style={{fontWeight:400,color:C.inkMuted}}>需求 {item.qty} 件</span></div>
        {onAddVariant&&<button onClick={onAddVariant} style={{fontSize:12,color:C.info,border:`1px solid ${C.info}`,background:C.surface,borderRadius:6,padding:"4px 10px",cursor:"pointer",marginTop:6}}>＋新增花色／尺寸（選單裡沒有時先建立）</button>}
        <div style={{fontSize:11,color:C.inkMuted,marginTop:4,lineHeight:1.6}}>這裡只會修改本工具內的訂單資料（配貨、出貨單會跟著更新）。iOPEN Mall／直播平台上的原始訂單不會被改，請依下方「異動紀錄」自行到平台修改或通知客人。</div>
        {done?(<div style={{marginTop:12}}>
          <div style={{fontSize:13,fontWeight:700,color:"#059669",marginBottom:6}}>✓ 已套用 {done.length} 筆異動</div>
          <textarea readOnly value={done.join("\n")} style={{width:"100%",height:140,fontSize:12,border:`1px solid ${C.line}`,borderRadius:8,padding:8,boxSizing:"border-box"}}/>
          <div style={{display:"flex",gap:8,marginTop:8}}><button style={btn} onClick={()=>{try{navigator.clipboard.writeText(done.join("\n"));}catch(e){}}}>複製紀錄</button><button style={{...btn,background:C.stamp,color:"#fff",border:"none"}} onClick={onClose}>完成</button></div>
        </div>):(<div>
        {!parsed&&<div style={{marginTop:10,fontSize:12,color:C.warning}}>尚未上傳客訂XLS，沒有客人訂單可修改；只能標記斷貨。</div>}
        {parsed&&rows.length===0&&<div style={{marginTop:10,fontSize:12,color:C.inkMuted}}>客訂XLS 內找不到訂這個品項的客人。</div>}
        {rows.filter(r=>!r.shipped).length>1&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:10}}><button style={btn} onClick={()=>all("cancel")}>全部取消</button><button style={btn} onClick={()=>all("keep")}>全部不動</button></div>}
        <div style={{marginTop:10}}>
          {rows.map(r=>{const d=get(r);return(
            <div key={r.oi+"_"+r.li} style={{borderTop:`1px solid ${C.line}`,padding:"8px 0",opacity:r.shipped?.55:1}}>
              <div style={{fontSize:13,color:C.ink,fontWeight:600}}>{r.account}{r.name&&r.name!==r.account?`（${r.name}）`:""}　<span style={{fontWeight:400,color:C.inkMuted}}>×{r.qty}{r.price?`　$${r.price}`:""}</span>{r.shipped&&<span style={{color:"#B91C1C",fontSize:11,marginLeft:8}}>已出貨，不可修改</span>}</div>
              {!r.shipped&&(<div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center",marginTop:6}}>

  function handleIopenAppXLS(files){

          var dkey=function(c){return c.orderNo+'|'+c.prod+'|'+(c.spec1||'')+'|'+(c.spec2||'');};
          var seen={};
          merged.forEach(function(c){seen[dkey(c)]=1;});

      {homeItem&&<HomeModal item={items.find(x=>x.id===homeItem.id)||homeItem} items={items} onApply={applyHome} onClose={()=>setHomeItem(null)}/>}
      {addVarItem&&<AddVariantModal item={addVarItem} items={items} onApply={applyAddVariants} onClose={()=>setAddVarItem(null)}/>}
      {chgItem&&<ChangeModal item={items.find(x=>x.id===chgItem.id)||chgItem} items={items} iopenData={iopenData} parsed={(iopenData&&iopenData.__orders__&&iopenData.__orders__.parsed)||null} savedAlloc={savedAlloc} changes={(iopenData&&iopenData.__orders__&&iopenData.__orders__.changes)||[]} onApply={applyOrderChanges} onClose={()=>setChgItem(null)} onAddVariant={()=>setAddVarItem(items.find(x=>x.id===chgItem.id)||chgItem)}/>}
      {batchSel.size>0&&!allocMode&&!countMode&&(
        <div style={{position:"fixed",bottom:0,left:0,right:0,background:C.ink,zIndex:50,padding:"14px 16px",boxShadow:"0 -4px 20px rgba(0,0,0,0.3)"}}>
          <div style={{maxWidth:640,margin:"0 auto"}}>
            <div style={{color:"rgba(255,255,255,0.7)",fontSize:12,marginBottom:10}}>已選 <strong style={{color:"#fff"}}>{batchSel.size}</strong> 筆，設定訂購日後按套用</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{color:"rgba(255,255,255,0.7)",fontSize:12,width:60,flexShrink:0}}>首次訂購日</span>
                <input type="date" value={batchDate1} onChange={e=>setBatchDate1(e.target.value)} style={{flex:1,background:"rgba(255,255,255,0.15)",border:"1px solid rgba(255,255,255,0.3)",borderRadius:8,padding:"8px 10px",fontSize:14,color:"#fff"}}/>
                <button onClick={()=>{setItems(prev=>{const next=prev.map(it=>batchSel.has(it.id)?{...it,firstOrderDate:batchDate1,...(it.orderedEdited?{}:{orderedQty:netNeed(it)})}:it);scheduleSave(next);return next;});setBatchDate1("");}} style={{background:C.stamp,color:"#fff",border:"none",borderRadius:8,padding:"8px 12px",fontSize:13,fontWeight:600,cursor:"pointer",flexShrink:0}}>套用</button>
                <button onClick={()=>{setItems(prev=>{const next=prev.map(it=>batchSel.has(it.id)?{...it,firstOrderDate:""}:it);scheduleSave(next);return next;});}} style={{background:"rgba(255,255,255,0.12)",color:"rgba(255,255,255,0.7)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,padding:"8px 10px",fontSize:12,cursor:"pointer",flexShrink:0}}>清除</button>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{color:"rgba(255,255,255,0.7)",fontSize:12,width:60,flexShrink:0}}>二次訂購日</span>
                <input type="date" value={batchDate2} onChange={e=>setBatchDate2(e.target.value)} style={{flex:1,background:"rgba(255,255,255,0.15)",border:"1px solid rgba(255,255,255,0.3)",borderRadius:8,padding:"8px 10px",fontSize:14,color:"#fff"}}/>
                <button onClick={()=>{setItems(prev=>{const next=prev.map(it=>batchSel.has(it.id)?{...it,secondOrderDate:batchDate2}:it);scheduleSave(next);return next;});setBatchDate2("");}} style={{background:C.stamp,color:"#fff",border:"none",borderRadius:8,padding:"8px 12px",fontSize:13,fontWeight:600,cursor:"pointer",flexShrink:0}}>套用</button>
                <button onClick={()=>{setItems(prev=>{const next=prev.map(it=>batchSel.has(it.id)?{...it,secondOrderDate:""}:it);scheduleSave(next);return next;});}} style={{background:"rgba(255,255,255,0.12)",color:"rgba(255,255,255,0.7)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,padding:"8px 10px",fontSize:12,cursor:"pointer",flexShrink:0}}>清除</button>
              </div>
              <button onClick={()=>{setBatchSel(new Set());setBatchDate1("");setBatchDate2("");}} style={{background:"transparent",color:"rgba(255,255,255,0.5)",border:"none",padding:"4px",fontSize:13,cursor:"pointer",textAlign:"center"}}>取消選取</button>
            </div>
          </div>
        </div>
      )}
      {/* 待叫貨清單（已扣現貨、已訂） */}
      {(()=>{
        if(countMode||allocMode)return null;
        const sOpen=items.filter(isShortOpen);
        const sg={};sOpen.forEach(it=>{(sg[displayProd(gProd(it))]=sg[displayProd(gProd(it))]||[]).push(it);});
        const sKeys=Object.keys(sg).sort((a,b)=>a.localeCompare(b));
        if(!sKeys.length)return null;
        const rep2=sKeys.map(k=>k+"\n"+sg[k].map(r=>"  "+[r.color,r.size,r.style].filter(Boolean).join(" ")+"：應收"+effOrderedQty(r)+"、實收"+(r.arrivedQty||0)+"、缺"+shortQty(r)+"件").join("\n")).join("\n");
        return(<div style={{background:C.surface,border:"2px solid #B91C1C",borderRadius:14,padding:"14px 16px",margin:"16px 0"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><span style={{fontSize:13,fontWeight:700,color:"#B91C1C"}}>📦 短少回報（{sOpen.length} 筆未處理）</span><button onClick={()=>{try{navigator.clipboard.writeText("您好，本次到貨清點後發現短少如下，麻煩協助補寄或確認：\n"+rep2);alert("已複製短少回報文字");}catch(e){}}} style={{marginLeft:"auto",fontSize:11,padding:"3px 10px",borderRadius:10,border:"1px solid #B91C1C",background:"transparent",color:"#B91C1C",cursor:"pointer"}}>複製給廠商</button></div>
          {sKeys.map(k=>(<div key={k} style={{marginBottom:8}}><div style={{fontSize:12,fontWeight:700,color:C.ink}}>{k}</div>{sg[k].map(r=>(<div key={r.id} style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginTop:3}}><span style={{fontSize:12,color:C.ink}}>{[r.color,r.size,r.style].filter(Boolean).join(" ")||"—"}</span><span style={{fontSize:11,color:"#B91C1C"}}>應收{effOrderedQty(r)}／實收{r.arrivedQty||0}／缺{shortQty(r)}</span><select value={r.shortStatus||""} onChange={e=>updateField(r.id,"shortStatus",e.target.value)} style={{marginLeft:"auto",border:`1px solid ${C.line}`,borderRadius:8,padding:"2px 6px",fontSize:11,background:C.surface}}>{SHORT_STATUS.map(([v,l])=>(<option key={v} value={v}>{l}</option>))}</select></div>))}</div>))}
        </div>);
      })()}
      {(()=>{
        if(countMode||allocMode)return null;
        const pend=items.filter(it=>toOrderQty(it)>0);
        const enough=items.filter(it=>netNeed(it)===0&&(it.qty||0)>0).length;
        const over=items.filter(it=>overOrderQty(it)>0);
        const groups={};
        pend.forEach(it=>{const k=displayProd(gProd(it));(groups[k]=groups[k]||[]).push(it);});
        const lines=Object.keys(groups).sort((a,b)=>a.localeCompare(b)).map(k=>({prod:k,rows:groups[k].slice().sort((a,b)=>sizeOrder(a.size||a.color)-sizeOrder(b.size||b.color)),total:groups[k].reduce((s2,i)=>s2+toOrderQty(i),0)}));
        const grand=lines.reduce((s2,l)=>s2+l.total,0);
        const copyText=lines.map(l=>l.prod+"\n"+l.rows.map(r=>"  "+[r.color,r.size,r.style].filter(Boolean).join(" ")+" × "+toOrderQty(r)).join("\n")).join("\n");
        return(<div style={{background:C.surface,border:`2px solid ${grand>0?C.orange:C.success}`,borderRadius:14,padding:"14px 16px",margin:"16px 0"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
            <span style={{fontSize:13,fontWeight:700,color:C.ink}}>🛒 待叫貨清單（已扣現貨與已訂）</span>
            <span style={{fontSize:12,color:C.inkMuted}}>共 {grand} 件</span>
            {grand>0&&<button onClick={()=>{try{navigator.clipboard.writeText(copyText);alert("已複製待叫貨清單");}catch(e){}}} style={{marginLeft:"auto",fontSize:11,padding:"3px 10px",borderRadius:10,border:`1px solid ${C.info}`,background:"transparent",color:C.info,cursor:"pointer"}}>複製</button>}
          </div>
          {enough>0&&<div style={{fontSize:11,color:C.success,marginBottom:6}}>✓ {enough} 項因現貨充足不用叫</div>}
          {over.length>0&&<div style={{fontSize:12,color:"#B91C1C",fontWeight:600,marginBottom:6}}>⚠ {over.length} 項訂購數超過淨需求（多叫）：{over.slice(0,5).map(dispName).join("、")}{over.length>5?"…":""}</div>}
          {grand===0?<div style={{fontSize:12,color:C.success}}>目前沒有需要再叫的貨</div>:lines.map(l=>(<div key={l.prod} style={{marginBottom:8}}>
            <div style={{fontSize:12,fontWeight:700,color:C.ink}}>{l.prod} <span style={{fontWeight:400,color:C.inkMuted}}>共{l.total}件</span></div>
            <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:3}}>{l.rows.map(r=>(<span key={r.id} style={{background:"#FFF3CD",color:"#B45309",borderRadius:12,padding:"2px 8px",fontSize:11}}>{[r.color,r.size,r.style].filter(Boolean).join(" ")||"—"}×{toOrderQty(r)}</span>))}</div>
          </div>))}
        </div>);
      })()}
      {/* 需求彙總（底部）*/}
      {summaryData.length>0&&!allocMode&&!countMode&&(
        <div style={{background:C.surface,border:`1px solid ${C.line}`,borderRadius:14,padding:"14px 16px",margin:"16px 0"}}>
          <div style={{fontSize:12,fontWeight:700,color:C.inkMuted,marginBottom:10}}>📋 需求彙總（未扣現貨）</div>
          {summaryData.map(({prod,prodTotal,variants})=>(
            <div key={prod} style={{marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:700,color:C.inkMuted,marginBottom:4}}>{prod} <span style={{fontWeight:400}}>共{prodTotal}件</span></div>
              {variants.map(({vk,szKeys,sg,total,allOrdered,anyOrdered,grpIds,szDone})=>{
                const color=allOrdered?C.success:anyOrdered?C.orange:C.ink;
                const bg=allOrdered?"#d4edda":anyOrdered?"#fff3e0":C.stripe;
                const canArrive=!allOrdered;
                const handleGroupArrive=()=>{
                  if(!window.confirm(`確認「${vk||prod}」共${total}件已清點、全數到貨？`))return;
                  const now=new Date().toISOString();
                  setItems(prev=>{
                    const next=prev.map(it=>{
                      if(!grpIds.includes(it.id))return it;
                      const maxQ=it.orderedQty!=null?it.orderedQty:it.qty;
                      return{...it,allArrived:true,counted:true,arrivalLog:[...(it.arrivalLog||[]),...(maxQ-(it.arrivedQty||0)>0?[{ts:now,d:maxQ-(it.arrivedQty||0),total:maxQ}]:[])],arrivedQty:maxQ,arrivedTs:it.arrivedTs||now,firstArrivedDate:it.firstArrivedDate||now.slice(0,10)};
                    });
                    scheduleSave(next);
                    return next;
                  });
                };
                return(
                  <div key={vk||"_"} style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap:4,marginBottom:4,opacity:allOrdered?0.5:1}}>
                    {vk&&<span style={{fontSize:12,fontWeight:600,color,minWidth:80,textDecoration:allOrdered?"line-through":"none"}}>{vk}</span>}
                    {szKeys.map(sz=>(<span key={sz} style={{background:szDone[sz]?"#d4edda":bg,borderRadius:12,padding:"2px 7px",fontSize:11,color:szDone[sz]?C.success:color}}>{sz}×{sg[sz]}</span>))}
                    <span style={{fontSize:11,color:C.inkMuted}}>共{total}件</span>
                    {canArrive&&<button onClick={handleGroupArrive} style={{marginLeft:"auto",fontSize:11,padding:"2px 8px",borderRadius:10,border:`1px solid ${C.success}`,background:"#f0faf4",color:C.success,cursor:"pointer"}}>全數到貨</button>}
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      )}
      {/* 置頂按鈕 */}
      <button onClick={()=>window.scrollTo({top:0,behavior:"smooth"})}
        style={{position:"fixed",bottom:24,right:20,width:44,height:44,borderRadius:22,
          background:C.ink,color:"#fff",border:"none",fontSize:20,cursor:"pointer",
          boxShadow:"0 2px 10px rgba(0,0,0,0.25)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center"}}>
        ↑
      </button>
    </div>
  );
}

class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null,info:null};}
  static getDerivedStateFromError(err){return{err:err};}
  componentDidCatch(err,info){this.setState({err:err,info:info});}
  render(){
    if(this.state.err){
      return React.createElement('div',{style:{whiteSpace:'pre-wrap',padding:20,color:'#b91c1c',fontFamily:'monospace',fontSize:13}},
        '畫面錯誤：\n'+String((this.state.err&&this.state.err.message)||this.state.err)+'\n\n'+((this.state.err&&this.state.err.stack)||'')+'\n\n元件位置：'+((this.state.info&&this.state.info.componentStack)||''));
    }
    return this.props.children;
  }
}
try{const root=ReactDOM.createRoot(document.getElementById("root"));root.render(React.createElement(ErrorBoundary,null,React.createElement(App)));}catch(err){document.body.innerHTML='<div style="white-space:pre-wrap;padding:20px;color:#b91c1c;font-family:monospace;font-size:13px;">Render錯誤：\n'+(err&&err.stack?err.stack:String(err))+'</div>';}
</script>
</body>
</html>
